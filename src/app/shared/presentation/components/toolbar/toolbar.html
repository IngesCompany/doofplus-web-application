<mat-toolbar class="toolbar">
  <a routerLink="/sign-in" class="brand"><img src="/doofplus-wordmark.png" alt="DoofPlus" class="toolbar-logo"/></a>
  @if (isEntryPage()) {
    <a [href]="landingUrl" class="back"><mat-icon>arrow_back</mat-icon>{{ 'shell.back-to-doofplus' | translate }}</a>
  } @else {
    <a routerLink="/sign-in" class="back"><mat-icon>arrow_back</mat-icon>{{ 'shell.all-environments' | translate }}</a>
  }
  <span class="spacer"></span>
  <a routerLink="/contact" class="contact" [attr.aria-label]="'shell.contact-us' | translate">
    <mat-icon aria-hidden="true">mail</mat-icon><span class="contact-text">{{ 'shell.contact-us' | translate }}</span>
  </a>
  <app-language-switcher/>
</mat-toolbar>
